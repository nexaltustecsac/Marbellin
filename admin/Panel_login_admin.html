<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff4f8"><title>Acceso administrativo | Marbellín Lencería</title>
<link rel="shortcut icon" href="../assets/icons/logo-marbellin.png" type="image/png">
<link rel="stylesheet" href="css/Panel_login_admin.css?v=20261120-acceso-elegante">
</head><body><main class="admin-auth-shell"><section class="admin-auth-card" aria-labelledby="authTitle">
<div class="auth-brand-frame"><a class="auth-brand" href="../index.html" aria-label="Ir a la tienda Marbellín Lencería"><img src="../assets/icons/logo-marbellin.png" alt="Logotipo oficial de Marbellín Lencería"></a></div>
<span class="auth-kicker">ÁREA PRIVADA</span><h1 id="authTitle">Acceso administrativo</h1>
<p class="auth-description">Ingresa con tus credenciales de administrador para gestionar tu tienda.</p>
<form id="loginForm" autocomplete="on" novalidate>
<div class="field-group"><label for="adminEmail">Correo del administrador</label><input type="email" id="adminEmail" value="marbellinLenceria@gmail.com" autocomplete="username" spellcheck="false" required></div>
<div class="field-group"><label for="password">Contraseña</label><div class="password-wrap"><input type="password" id="password" autocomplete="current-password" required aria-describedby="loginError"><button class="password-toggle" id="togglePassword" type="button" aria-label="Mostrar contraseña" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<button type="submit" class="auth-submit" id="loginSubmit">Iniciar sesión</button></form>
<p id="loginError" class="auth-message error-message" role="alert" aria-live="assertive"></p>
<a class="back-to-store" href="../index.html">Ir a la tienda</a>
<p class="auth-footer">Marbellín Lencería · Acceso exclusivo para administración</p></section></main>
<script src="js/Panel_login_admin.js?v=20261120-acceso-elegante"></script></body></html>
