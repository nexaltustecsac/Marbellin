<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171417" />
  <title>Acceso administrativo | Marbellín Lencería</title>
  <link rel="shortcut icon" href="imagenes/icono.ico" type="image/x-icon" />
  <link rel="stylesheet" href="css/login-admin-clean.css" />
</head>
<body>
  <main class="admin-auth-shell">
    <a class="auth-brand" href="../index.html" aria-label="Volver a Marbellín Lencería">
      <img src="imagenes/Logo.png" alt="Marbellín Lencería" />
    </a>
    <section class="admin-auth-card" aria-labelledby="authTitle">
      <span class="auth-kicker">ÁREA PRIVADA</span>
      <h1 id="authTitle">Acceso administrativo</h1>
      <p class="auth-description">Ingresa con tus credenciales de administrador para gestionar tu tienda.</p>
      <form id="loginForm" autocomplete="on">
        <label for="adminEmail">Correo del administrador</label>
        <input type="email" id="adminEmail" value="marbellinLenceria@gmail.com" autocomplete="username" readonly required />
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required />
        <button type="submit" class="auth-submit">Iniciar sesión</button>
      </form>
      <p id="loginError" class="auth-message error-message" role="alert"></p>
      <div id="loginSuccess" class="auth-message success-message" aria-live="polite"></div>
      <a class="back-to-store" href="../index.html">Volver a la tienda</a>
    </section>
    <p class="auth-footer">Marbellín Lencería · Acceso exclusivo para administración</p>
  </main>
  <script src="js/jslogin-admin.js"></script>
</body>
</html>
