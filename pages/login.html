<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Marbellín Lencería</title>
  <link rel="stylesheet" href="../css/login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <main class="contenedor-formulario">
    <section class="formulario active" id="loginContainer">
      <h2>Iniciar sesión</h2>
      <form id="formLogin" autocomplete="on">
        <input type="text" id="usuarioLogin" placeholder="Correo electrónico o DNI" autocomplete="username" required />
        <div class="password-wrapper">
          <input type="password" id="contrasenaLogin" placeholder="Contraseña" autocomplete="current-password" required />
          <span class="toggle-password" data-target="contrasenaLogin"><i class="fa-regular fa-eye"></i></span>
        </div>
        <button type="submit">Ingresar</button>
        <p class="cambiar">¿No tienes cuenta? <a href="registro.html">Crear cuenta</a></p>
        <p class="recuperar"><a href="#" id="olvidarContrasena">¿Olvidaste tu contraseña?</a></p>
      </form>
    </section>

    <section class="formulario" id="recuperarContainer" style="display:none;">
      <h2>Recuperar contraseña</h2>
      <form id="formRecuperar" autocomplete="off">
        <input type="text" id="usuarioRecuperar" placeholder="Correo o DNI" required />
        <button type="button" id="enviarCodigo">Enviar código</button>
        <input type="text" id="codigoVerificacion" placeholder="Ingresa el código" required />
        <button type="button" id="verificarCodigo">Verificar código</button>
        <div id="codigoSimulado"></div>
        <div id="nuevaContrasenaContainer" style="display:none;">
          <div class="password-wrapper">
            <input type="password" id="nuevaContrasena" placeholder="Nueva contraseña" />
            <span class="toggle-password" data-target="nuevaContrasena"><i class="fa-regular fa-eye"></i></span>
          </div>
          <div class="password-wrapper">
            <input type="password" id="confirmarNuevaContrasena" placeholder="Confirmar nueva contraseña" />
            <span class="toggle-password" data-target="confirmarNuevaContrasena"><i class="fa-regular fa-eye"></i></span>
          </div>
          <button type="button" id="actualizarContrasena">Actualizar contraseña</button>
        </div>
        <p class="cambiar">¿Recordaste tu contraseña? <a href="#" id="volverLogin">Iniciar sesión</a></p>
      </form>
    </section>
  </main>
  <script type="module" src="../js/login.js"></script>
</body>
</html>
