<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta | Marbellín Lencería</title>
  <link rel="stylesheet" href="../css/login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <main class="contenedor-formulario">
    <section class="formulario active" id="registroContainer">
      <h2>Crear cuenta</h2>
      <form id="formRegistro" autocomplete="on">
        <input type="text" id="nombres" placeholder="Nombres completos" required />
        <input type="text" id="apellidos" placeholder="Apellidos completos" required />
        <input type="text" id="dni" placeholder="DNI" maxlength="8" pattern="[0-9]{8}" inputmode="numeric" required />
        <input type="tel" id="telefono" placeholder="Celular" maxlength="9" pattern="[0-9]{9}" inputmode="numeric" required />
        <label for="departamento">Departamento:</label>
        <select id="departamento" required>
          <option value="">Seleccione Departamento</option>
          <option value="Lima">Lima</option><option value="Arequipa">Arequipa</option><option value="Cusco">Cusco</option>
        </select>
        <label for="provincia">Provincia:</label>
        <select id="provincia" required><option value="">Seleccione Provincia</option></select>
        <label for="distrito">Distrito:</label>
        <select id="distrito" required><option value="">Seleccione Distrito</option></select>
        <input type="email" id="correo" placeholder="Correo electrónico" required />
        <div class="password-wrapper">
          <input type="password" id="contrasena" placeholder="Contraseña" required />
          <span class="toggle-password" data-target="contrasena"><i class="fa-regular fa-eye"></i></span>
        </div>
        <div class="password-wrapper">
          <input type="password" id="confirmarContrasena" placeholder="Confirmar contraseña" required />
          <span class="toggle-password" data-target="confirmarContrasena"><i class="fa-regular fa-eye"></i></span>
        </div>
        <button type="submit">Registrarme</button>
        <p class="cambiar">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
      </form>
    </section>
  </main>
  <script type="module" src="../js/registro.js"></script>
  <script type="module" src="../js/cargar-ubicacion.js"></script>
</body>
</html>
